name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Build (iOS)
        run: xcodebuild build -scheme swift-fluent-theme -destination 'generic/platform=iOS Simulator'

      - name: Build & test (macOS)
        run: swift test
